<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С Днём Победы!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a1a;
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        #fireworks {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem;
            width: 100%;
            max-width: 600px;
        }

        /* Анимация выплывания */
        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Звезда */
        .star-icon {
            font-size: clamp(3rem, 10vw, 4.5rem);
            color: #ffd700;
            text-shadow: 0 0 25px rgba(255, 215, 0, 0.8), 0 0 50px rgba(255, 100, 0, 0.4);
            margin-bottom: 0.5rem;
            
            opacity: 0;
            animation: floatUp 1.2s ease-out forwards;
            animation-delay: 0.2s;
        }

        .title {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.2;
            text-align: center;
            
            opacity: 0;
            animation: floatUp 1.5s ease-out forwards;
            animation-delay: 0.6s;
        }

        .title .date {
            font-size: clamp(2.5rem, 9vw, 4rem);
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 4px 10px rgba(0,0,0,0.8);
            font-weight: 700;
            letter-spacing: 2px;
        }

        .title .phrase {
            font-size: clamp(1.4rem, 5.5vw, 2.2rem);
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4), 0 4px 10px rgba(0,0,0,0.8);
            font-weight: 600;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .years-passed {
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            color: #ffcc00;
            font-weight: bold;
            margin-top: 0.5rem;
            opacity: 0.9;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .greeting-box {
            background: rgba(10, 10, 30, 0.75);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 215, 0, 0.35);
            border-radius: 24px;
            aspect-ratio: 1 / 1; /* Квадрат */
            width: min(85vw, 450px);
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 215, 0, 0.05);
            
            opacity: 0;
            animation: floatUp 1.5s ease-out forwards;
            animation-delay: 1.4s;
        }

        .greeting-text {
            font-size: clamp(1rem, 3.5vw, 1.25rem);
            line-height: 1.6;
            color: #f0f0f0;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }

        @media (max-width: 600px) {
            .container { gap: 1rem; }
            .greeting-box { border-radius: 20px; padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <canvas id="fireworks"></canvas>
    
    <div class="container">
        <!-- Звезда -->
        <div class="star-icon">★</div>

        <div class="title">
            <span class="date">9 Мая</span>
            <span class="phrase">С Днём Великой Победы!</span>
            <!-- Блок с количеством лет -->
            <div class="years-passed" id="years-counter"></div>
        </div>
        
        <div class="greeting-box">
            <p class="greeting-text">
                От всей души поздравляем вас с этим священным праздником! Низкий поклон героям, отстоявшим мир и свободу. Пусть мужество и стойкость наших предков вдохновляют на добрые дела, а в ваших домах всегда царят счастье, здоровье и благополучие. Помним. Гордимся. Чтим.
            </p>
        </div>
    </div>

    <script>
        // Расчет количества лет
        const currentYear = new Date().getFullYear();
        const victoryYear = 1945;
        const yearsPassed = currentYear - victoryYear;
        
        document.getElementById('years-counter').textContent = `Прошло ${yearsPassed} лет`;

        // Логика салютов
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.008;
                this.gravity = 0.06;
                this.size = Math.random() * 2 + 1;
            }
            update() {
                this.vx *= 0.98; this.vy *= 0.98;
                this.vy += this.gravity;
                this.x += this.vx; this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Firework {
            constructor(sx, sy, tx, ty) {
                this.x = sx; this.y = sy;
                this.tx = tx; this.ty = ty;
                this.distanceToTarget = Math.hypot(tx - sx, ty - sy);
                this.distanceTraveled = 0;
                this.angle = Math.atan2(ty - sy, tx - sx);
                this.speed = 3.5; this.acceleration = 1.03;
                this.particles = []; this.exploded = false;
                this.colors = ['#ff4d4d', '#ffd700', '#ffffff', '#ff8c00', '#00e676', '#ff3366', '#3399ff'];
                this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
            }
            update() {
                if (!this.exploded) {
                    this.speed *= this.acceleration;
                    const vx = Math.cos(this.angle) * this.speed;
                    const vy = Math.sin(this.angle) * this.speed;
                    this.x += vx; this.y += vy;
                    this.distanceTraveled += Math.hypot(vx, vy);
                    if (this.distanceTraveled >= this.distanceToTarget) this.explode();
                }
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    this.particles[i].update();
                    if (this.particles[i].alpha <= 0) this.particles.splice(i, 1);
                }
            }
            explode() {
                this.exploded = true;
                for (let i = 0; i < 70; i++) this.particles.push(new Particle(this.x, this.y, this.color));
            }
            draw() {
                if (!this.exploded) {
                    ctx.save(); ctx.globalAlpha = 0.9; ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 8; ctx.shadowColor = this.color;
                    ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
                this.particles.forEach(p => p.draw());
            }
        }

        const fireworks = [];

        function createFirework() {
            const startX = canvas.width / 2 + (Math.random() - 0.5) * 150;
            const startY = canvas.height;
            const targetX = canvas.width / 2 + (Math.random() - 0.5) * 250;
            const targetY = canvas.height / 2 + (Math.random() - 0.5) * 180;
            fireworks.push(new Firework(startX, startY, targetX, targetY));
        }

        let frameCount = 0;
        function animate() {
            ctx.fillStyle = 'rgba(10, 10, 26, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            frameCount++;
            let spawnRate = 0.03; 
            if (frameCount > 100) spawnRate = 0.05;

            if (Math.random() < spawnRate) createFirework();

            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if (fireworks[i].exploded && fireworks[i].particles.length === 0) {
                    fireworks.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
